name: Chocolatine

on:
  push:
    branches-ignore:
      - 'ga-ignore*'
  pull_request:
    branches-ignore:
      - 'ga-ignore*'

env:
  MIRROR_URL: git@github.com:EpitechPGEPromo2029/B-DOP-200-PAR-2-1-chocolatine-marc.ye.git  

jobs:
  check_coding_style:
    runs-on:  ubuntu-latest
    container:
        image:  ghcr.io/epitech/coding-style-checker:latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run:  |
          if [ ${{ github.repository }} != ${{ env.MIRROR_URL }} ]
          then
            exit 0
          else
            exit 1
          fi
      - run:  |
          check.sh ${{ github.repository }} ${{ github.repository }}
          if [ -f coding-style-reports.log ]
          then
            echo "::error file=col=5"
          else
            exit 1
          fi

  check_program_compilation:
    runs-on: ubuntu-latest
    container:
      image:  epitechcontent/epitest-docker
    needs:  [check_coding_style]
    if: ${{ needs.check_coding_style.result == 'success'}}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: make
      - run: make fclean

  run_tests:
    runs-on: ubuntu-latest
    container:
      image:  epitechcontent/epitest-docker
    needs:  [check_program_compilation]
    if: ${{ needs.check_program_compilation.result == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: make run_tests
  
  push_to_mirror:
    runs-on: ubuntu-latest
    needs:  [run_tests]
    if: ${{ github.event_name == 'push' && needs.run_tests.result == 'success'}}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pixta-dev/repository-mirroring-action@v1
        with:
          target_repo_url:
            git@github.com:EpitechPGEPromo2029/B-DOP-200-PAR-2-1-bschocolatine-marc.ye.git
          ssh_private_key:
            ${{ secrets.GIT_SSH_PRIVATE_KEY }}
      