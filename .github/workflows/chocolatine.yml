name: Chocolatine

on:
  push:
    branches-ignore:
      - 'ga-ignore*'
  pull_request:
    branches-ignore:
      - 'ga-ignore*'

jobs:
  check_coding_style:
    if: ${{ github.repository != vars.MIRROR_URL }}
    runs-on: ubuntu-latest
    container: ghcr.io/epitech/coding-style-checker:latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: check.sh $(pwd) $(pwd)
      - run: echo "::error file=coding-style-reports.log, line=1, col=2, coding style error:, ::ok"

  check_program_compilation:
    runs-on: ubuntu-latest
    needs:  [check_coding_style]
    if: ${{ needs.check_coding_style.result == 'success'}}
    container: epitechcontent/epitest-docker
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: make
      - run: make fclean

  run_tests:
    runs-on: ubuntu-latest
    needs:  [check_program_compilation]
    if: ${{ needs.check_program_compilation.result == 'success'}}
    container: epitechcontent/epitest-docker
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: make run_tests
  
  push_to_mirror:
    runs-on: ubuntu-latest
    needs:  [run_tests]
    if: ${{ needs.run_tests.result == 'success'}}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pixta-dev/repository-mirroring-action@v1
        with:
          target_repo_url:
            git@github.com:EpitechPGEPromo2029/B-DOP-200-PAR-2-1-bschocolatine-marc.ye.git
          ssh_private_key:
            ${{ secrets.GIT_SSH_PRIVATE_KEY }}
      