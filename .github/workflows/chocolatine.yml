name: Chocolatine

on:
  push:
    branches-ignore:
      - 'ga-ignore-*'
  pull_request:
    branches-ignore:
      - 'ga-ignore-*'

jobs:
  check_program_compilation:
    runs-on: ubuntu-latest
    container:
      image:  epitechcontent/epitest-docker
    steps:
      - name: check repository
        uses: actions/checkout@v4
      - name: execute make
        run:  make
      - name: execute make clean
        run:  make clean
      - name: check and execute EXECUTABLES
        run:  |
          IFS=',' read -r exec << ${{ vars.EXECUTABLES }}
          for exe in ${exec[@]}; do
            if [ ! -x $exe ]
            then
              exit 1
            else
              echo "$exe"
            fi
          done

