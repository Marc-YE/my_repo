name: Chocolatine

on:
  push:
    branches-ignore:
      - 'ga-ignore-*'
  pull_request:
    branches-ignore:
      - 'ga-ignore-*'

env:
  MIRROR_URL: ${{ vars.MIRROR_URL}}
  MIRROR_NAME: ${{ vars.MIRROR_NAME }}
  EXECUTABLES:  ${{ vars.EXECUTABLES }}

jobs:
  check_coding_style:
    runs-on:  ubuntu-latest
    container:
        image:  ghcr.io/epitech/coding-style-checker:latest
    steps:
      - name: check repository
        uses: actions/checkout@v4
      - name: check if in the mirror repository
        run:  |
          if [ ${{ github.repository }} != ${{ env.MIRROR_NAME }} ]
          then
            exit 0
          else
            exit 1
          fi
      - name: run script and error message
        run:  |
          check.sh $(pwd) $(pwd)
          if [ -f coding-style-reports.log ]
          then
            while read -r line; do
              FILE=$(echo "$line" | cut -d ':' -f1)
              FILE_NAME=$(echo "$FILE" | cut -d '/' -f2-)
              LINE=$(echo "$line" | cut -d ':' -f2)
              TYPE=$(echo "$line" | cut -d ':' -f3)
              CODE_ERROR=$(echo "$line" | cut -d ':' -f4-)
              echo "::error file=$FILE_NAME,line=$LINE,title=$TYPE coding style error::$CODE_ERROR"
            done < coding-style-reports.log
          fi
      - name: check if file exist and not void
        run:  |
          if [ -s coding-style-reports.log ]
          then
            exit 1
          fi

  check_program_compilation:
    runs-on: ubuntu-latest
    container:
      image:  epitechcontent/epitest-docker
    needs:  [check_coding_style]
    steps:
      - name: check repository
        uses: actions/checkout@v4
      - name: execute make
        run:  make
        timeout-minutes:  2
      - name: execute make clean
        run:  make clean
      - name: check and execute EXECUTABLES
        run:  |
          while IFS=',' read -a line < ${{ env.EXECUTABLES }} ; do
            for exe in $line ; do
              if [ ! -x "$exe" ]
              then
                exit 1
              fi
            done
          done

  run_tests:
    runs-on: ubuntu-latest
    container:
      image:  epitechcontent/epitest-docker
    needs:  [check_program_compilation]
    steps:
      - name: check repository
        uses: actions/checkout@v4
      - name: execute tests_run
        run: make tests_run
        timeout-minutes:  2

  push_to_mirror:
    runs-on: ubuntu-latest
    needs:  [run_tests]
    if: ${{ github.event_name == 'push' }}
    steps:
      - name: check repository
        uses: actions/checkout@v4
        with:
          fetch-depth:  0
      - name: mirror repository
        uses: pixta-dev/repository-mirroring-action@v1
        with:
          target_repo_url:
            $env.MIRROR_URL
          ssh_private_key: 
            ${{ secrets.GIT_SSH_PRIVATE_KEY }}
      