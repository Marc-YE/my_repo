name: Chocolatine

on:
  push:
    branches-ignore:
      - 'ga-ignore*'
  pull_request:
    branches-ignore:
      - 'ga-ignore*'

jobs:
  check_coding_style:
    if: ${{ github.repository != vars.MIRROR_URL }}
    runs-on: ubuntu-latest
    container: ghcr.io/epitech/coding-style-checker:latest
    steps:
      - run: check.sh $(pwd) $(pwd) 
  lol:
    runs-on: ubuntu-latest
    needs:  [check_coding_style]
    if: ${{ needs.check_coding_style.result == 'success'}}
    steps:
      - run: echo "haha"
  to_github:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pixta-dev/repository-mirroring-action@v1
        with:
          target_repo_url:
            git@github.com:EpitechPGEPromo2029/B-DOP-200-PAR-2-1-bschocolatine-marc.ye.git
          ssh_private_key:
            ${{ secrets.GIT_SSH_PRIVATE_KEY }}
      