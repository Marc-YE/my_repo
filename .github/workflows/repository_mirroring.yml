name: Mirroring 1

on:
  push:
    branches:
      - main
      - '!ga-ignore'
  pull_request:
    branches:
      - main
      - '!ga-ignore'

jobs:
  to_github:
    if: ${{ github.repository }} != 'EpitechPGEPromo2029/B-DOP-200-PAR-2-1-bschocolatine-marc.ye.git'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pixta-dev/repository-mirroring-action@v1
        with:
          target_repo_url:
            git@github.com:EpitechPGEPromo2029/B-DOP-200-PAR-2-1-bschocolatine-marc.ye.git
          ssh_private_key:
            ${{ secrets.GIT_SSH_PRIVATE_KEY }}